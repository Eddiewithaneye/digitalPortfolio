<!-- HTML boiler plate include a document type, an html wrapper, a head and a body -->
 <!-- Tags are closed with same name + forward slash-->
<!DOCTYPE html>
    <html>
        <head>
            <!-- This is where the instructors for the browser lives-->
            <!-- Linking the css file using link relative-->
            <!-- The browser needs this template to connect files: a link, a relationship, and a hypertextrefernce-->
             <link rel="stylesheet" href="style.css"> <!-- Self closing tag because it doesn't need to wrap content just give instructions.-->

            <!-- Create a title for the browser to display on the browser tab-->
             <title> Eddie's Portfolio</title>
        </head>
        <body>
            <!-- This is where the content that the browser displays lives-->

            <!-- Building a h1 header(There are 6 types). An h2 header for Projects. A one line paragraph about me-->
            <!-- Organize the content by sections--> 
            <section>
                <h1> Welcome to Eddie's Portfolio!</h1>
                <p> I am looking to be of service with the computer skills that I pickup! </p>
             </section> <!--About me section-->
             <section>
                <h2> Fully Functional Projects!</h2> 
                <!-- Give the people what they want! A github link-->
                <p><a href="https://www.github.com/eddiewithaneye"> Check out my github. I am a conisseur of the green dots!</a></p>
            </section> <!-- Showing off section-->
        </body>
</html>
